<div id="boot-fail" style="display:none;position:fixed;inset:0;z-index:99;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;font-family:-apple-system,Arial,sans-serif;color:#f5f3ef;background:#070707">
  <b style="font-size:20px">No se ha podido cargar HARDMODE</b>
  <p id="boot-msg" style="color:rgba(245,243,239,.6);font-size:14px;max-width:320px"></p>
  <button onclick="location.reload()" style="margin-top:12px;background:#FF2A1F;color:#fff;border:0;border-radius:6px;padding:14px 22px;font-weight:800;font-size:15px">Reintentar</button>
</div>
<script>
/* Red de seguridad: si algo falla al arrancar, se ve un aviso en vez de una pantalla negra */
(function(){var shown=false;function fail(m){if(shown)return;shown=true;var d=document.getElementById('boot-fail');document.getElementById('boot-msg').textContent=m||'Revisa la conexión y vuelve a intentarlo.';d.style.display='flex';}
window.addEventListener('error',function(e){if(!document.querySelector('#app *'))fail('Error: '+(e.message||'desconocido'));});
setTimeout(function(){if(!document.querySelector('#app *'))fail();},8000);})();
</script>
